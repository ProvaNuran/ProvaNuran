<svg width="120" height="120" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
<style>
@keyframes moonblink {
  0%, 45%, 100% { transform: scaleY(1); }
  48%, 52% { transform: scaleY(0.1); }
}
@keyframes twinkle2 {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}
.moonface { animation: moonblink 4s ease-in-out infinite; transform-origin: center; }
.st1 { animation: twinkle2 1.5s ease-in-out infinite; }
.st2 { animation: twinkle2 1.5s ease-in-out infinite 0.5s; }
.st3 { animation: twinkle2 1.5s ease-in-out infinite 1s; }
</style>
