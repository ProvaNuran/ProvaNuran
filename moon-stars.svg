<path class="st1" d="M-10 20 L-8 26 L-2 26 L-7 30 L-5 36 L-10 32 L-15 36 L-13 30 L-18 26 L-12 26 Z" fill="#8AB4F8"/>
<path class="st2" d="M75 15 L77 20 L82 20 L78 23 L80 28 L75 25 L70 28 L72 23 L68 20 L73 20 Z" fill="#8AB4F8"/>
<path class="st3" d="M80 70 L82 74 L86 74 L83 77 L84 81 L80 78 L76 81 L77 77 L74 74 L78 74 Z" fill="#8AB4F8"/>
</svg>
